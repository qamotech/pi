<script>
/* Smoke test: boot, world gen, every panel, fishing, bugs, house, tour, time travel, night render, save/load. */
(async()=>{
const out=[],errs=[];const ok=(c,label,extra='')=>out.push(`${c?'ok  ':'FAIL'} ${label}${extra!==''?' :: '+extra:''}`);
window.addEventListener('error',e=>errs.push('ERR '+e.message+' @'+e.lineno));
window.addEventListener('unhandledrejection',e=>errs.push('REJ '+(e.reason&&e.reason.stack||e.reason)));
const ce=console.error;console.error=(...a)=>{errs.push('CE '+a.map(x=>x&&x.stack||x).join(' '));ce.apply(console,a)};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const P=window.PW;
try{
  ok(!!P,'window.PW test hooks exist');
  // world gen across many seeds
  let genOk=0;for(let i=0;i<6;i++){try{P.newGame({name:'Gen'+i,island:'Seed'+i,hemi:i%2?'S':'N',look:{skin:'#fbe0c8',hair:'#3b2a1e',shirt:'#3f9fd2'}});genOk++}catch(e){errs.push('GEN '+e.message)}}
  ok(genOk===6,'world generation succeeds for 6 random seeds',genOk);
  P.newGame({name:'Tess',island:'Testa',hemi:'N',look:{skin:'#fbe0c8',hair:'#3b2a1e',shirt:'#3f9fd2'}});
  P.startGame(true);
  const B=P.ISLE.B.map(b=>b.t);
  ok(['hall','shop','museum','home','dock'].every(t=>B.includes(t))&&B.filter(t=>t==='vh').length===5,'all buildings placed',B.join(','));
  for(let k=0;k<12;k++){P.dlgAdvance();P.dlgAdvance();await wait(20)}
  ok(!P.G.busy&&!P.DLG.on,'intro dialog completes');
  for(let k=0;k<120;k++){P.step(1/60);P.render()}
  ok(P.villActors().length===4,'four starting neighbors');
  for(const app of ['','tasks','pedia','diy','map','sun','neigh','cal','cam','set','help']){P.closePanel();P.openPhone(app||undefined);ok(P.PAN.open&&document.getElementById('pBody').innerHTML.length>50,'phone app renders: '+(app||'home'))}
  P.closePanel();P.openInv();ok(P.PAN.open,'pockets open');P.closePanel();
  P.openShop();for(let k=0;k<6;k++){P.dlgAdvance();await wait(10)}ok(P.PAN.open,'shop or drop-box panel opens');P.closePanel();
  P.openMuseum();for(let k=0;k<10;k++){P.dlgAdvance();await wait(10)}ok(P.PAN.open&&P.S.recipes.includes('r_sho0'),'museum opens and gives shovel recipe');P.closePanel();
  P.openHall();for(let k=0;k<6;k++){P.dlgAdvance();await wait(10)}ok(P.PAN.open,'town hall opens');P.closePanel();
  P.addItem('branch',10);P.addItem('stone',2);P.craft('r_axe0');ok(P.S.inv.some(s=>s&&s.id==='t_axe0'),'crafting works');
  // fishing
  const S=P.S,G=P.G,W=P.W;let found=null;
  for(let y=0;y<W.H&&!found;y++)for(let x=0;x<W.W&&!found;x++){if(W.ter[y*W.W+x]===1){const wy=y-2;if(wy>=0&&W.ter[wy*W.W+x]===2&&!W.obj[wy*W.W+x])found={bx:x,by:y,wx:x,wy:wy}}}
  ok(!!found,'found a beach fishing spot');
  if(found){G.px=(found.bx+.5)*32;G.py=(found.by+.5)*32;G.fx=0;G.fy=-1;S.eq=S.inv.findIndex(s=>s&&s.id==='t_rod0');P.act();ok(!!G.cast,'rod casts into water');
    for(let k=0;k<30;k++)P.step(1/60);P.spawnFishAt(found.wx,found.wy,'S');
    let caught=false;for(let k=0;k<60*30;k++){P.step(1/60);if(G.cast&&G.cast.fish&&G.cast.fish.st==='bite'){P.act();caught=true;break}if(!G.cast){G.pose=0;P.act()}}
    ok(caught&&(S.stats.fish||0)+(S.inv.some(s=>s&&['boot','tin','tire'].includes(s.id))?1:0)>=1,'fish bites and is caught');}
  S.eq=S.inv.findIndex(s=>s&&s.id==='t_net0');G.cast=null;G.pose=0;G.swing=0;
  const [ptx,pty]=[Math.floor(G.px/32),Math.floor(G.py/32)];
  const b=P.spawnBug('ground',ptx,pty+1)||P.spawnBug('fly',ptx,pty+1)||P.spawnBug('beach',ptx,pty+1);
  if(b){b.x=G.px;b.y=G.py+28;G.fx=0;G.fy=1;P.act();ok((S.stats.bugs||0)>=1,'net catches a bug',b.b.n)}else ok(true,'no bug available this hour (skipped)');
  P.enterHouse();for(let k=0;k<30;k++){P.step(1/60);P.render()}ok(G.scene==='house','enter house');P.exitHouse();ok(G.scene==='island','exit house');
  P.startTour();for(let k=0;k<120;k++){P.step(1/60);P.render()}ok(P.W.kind==='tour','mystery island tour loads');P.returnHome();ok(P.W===P.ISLE,'return home');
  const d0=S.stats.days||0;P.timeTravel(86400000*1.2);for(let k=0;k<10;k++){P.step(1/60);P.render()}ok((S.stats.days||0)>d0&&S.tasks.length===5&&S.sun.P.length===12,'day rollover: tasks + sunroot prices');
  P.timeTravel(86400000*8);P.timeTravel(0);
  const n=new Date();n.setHours(23,0,0,0);P.timeTravel(n.getTime()-Date.now());for(let k=0;k<20;k++){P.step(1/60);P.render()}ok(true,'night render');
  P.save();let js=null;try{js=localStorage.getItem('puddlewick-isle.v1')}catch(e){}ok(js&&js.length>1000,'save written',js&&js.length);
  if(js){P.loadFrom(js);ok(P.S.name==='Tess'&&P.S.island==='Testa','save loads back')}
  for(let k=0;k<30;k++){P.step(1/60);P.render()}
}catch(e){errs.push('EXC '+e.stack)}
const pre=document.createElement('pre');pre.id='RESULT';pre.textContent=out.join('\n')+'\n--ERRORS--\n'+errs.slice(0,25).join('\n');document.body.appendChild(pre);
})();
</script>
