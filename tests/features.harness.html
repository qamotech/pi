<script>
/* Feature regression tests.
   Every automated upgrade run appends one block per new feature/improvement ABOVE the END marker.
   Use ok(condition, 'label') for each check. Keep blocks independent (wrap each in its own try/catch). */
(async()=>{
const out=[],errs=[];const ok=(c,label,extra='')=>out.push(`${c?'ok  ':'FAIL'} ${label}${extra!==''?' :: '+extra:''}`);
window.addEventListener('error',e=>errs.push('ERR '+e.message+' @'+e.lineno));
window.addEventListener('unhandledrejection',e=>errs.push('REJ '+(e.reason&&e.reason.stack||e.reason)));
const ce=console.error;console.error=(...a)=>{errs.push('CE '+a.map(x=>x&&x.stack||x).join(' '));ce.apply(console,a)};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const click=sel=>{const b=document.querySelector(sel);if(b){b.click();return true}return false};
const P=window.PW;
const adv=async(n=10)=>{for(let k=0;k<n;k++){P.dlgAdvance();await wait(5)}};
// fresh(): 11:00 on the CURRENT island day (days roll over at 5 AM), so runs between midnight and 5 AM don't skip a day
const fresh=async()=>{P.closePanel();P.newGame({name:'Tess',island:'Testa',hemi:'N',look:{skin:'#fbe0c8',hair:'#3b2a1e',shirt:'#3f9fd2'}});const d=new Date(Date.now()-5*36e5);d.setHours(11,0,0,0);P.S.timeOff=d.getTime()-Date.now();P.startGame(true);await adv(12)};
try{
  await fresh();
  const S=P.S,G=P.G;
  ok(typeof P.APP_VERSION==='string'&&/^\d+\.\d+\.\d+$/.test(P.APP_VERSION),'APP_VERSION is exposed',P.APP_VERSION);

  // v1.2.0 Saturday Derby
  try{
    await fresh();const S=P.S,G=P.G;
    const at=(days,h)=>{const d=new Date();d.setDate(d.getDate()+((6-d.getDay()+7)%7)+7+days);d.setHours(h,0,0,0);P.timeTravel(d.getTime()-Date.now())};
    const hasTrophy=id=>S.inv.some(s=>s&&s.id===id)||P.ISLE.obj.some(o=>o&&o.id===id);
    const nTrophies=()=>S.inv.filter(s=>s&&/^fu_dt/.test(s.id)).length+P.ISLE.obj.filter(o=>o&&/^fu_dt/.test(o.id||'')).length;
    const land=sz=>{const f=P.FISH.find(q=>q.sz===sz),mr=Math.random;Math.random=()=>.5;try{P.landFish({f,st:'bite'})}finally{Math.random=mr}};
    const run=async()=>{P.closePanel();for(let i=0;i<370&&P.tr;i++)P.step(.5);await adv(10)};
    if(G.scene!=='island')P.exitHouse();
    at(0,11);const k1=P.derbyKind();
    ok(k1==='fish'||k1==='bug','derby: Saturday 11 AM has a kind',k1);
    ok(P.events().some(e=>/Derby|Bug-Off/.test(e)),'derby: events line on Saturday',P.events().join('|'));
    ok(P.npcs().some(a=>a.P&&a.P.n==='Marlowe'),'derby: Marlowe is in the plaza');
    at(0,19);ok(P.derbyKind()===null&&!P.npcs().some(a=>a.derby),'derby: closed at 7 PM');
    at(1,11);ok(P.derbyKind()===null&&!P.npcs().some(a=>a.derby),'derby: closed on Sunday');
    at(-1,12);ok(P.events().some(e=>/tomorrow/.test(e)),'derby: Friday tomorrow line');
    at(7,11);const k2=P.derbyKind();ok(k2&&k2!==k1,'derby: consecutive Saturdays alternate',k1+'/'+k2);
    const fw=k1==='fish'?0:7,bw=7-fw;
    at(fw,11);ok(P.startDerby()&&P.tr.k==='fish'&&Math.abs(P.tr.t-180)<1,'derby: fish round starts at 180s');
    land(6);ok(P.tr.score===4,'derby: size-6 fish scores 4',P.tr.score);
    P.catchBug(P.BUGS[0]);ok(P.tr.score===4,'derby: bug scores 0 on fish week',P.tr.score);
    land(6);const pts0=S.pts,sc=P.tr.score;
    await run();
    ok(P.tr===null,'derby: round ends after 180s');
    ok(S.derby.best.fish>=4&&S.derby.rounds===1,'derby: best and rounds recorded',JSON.stringify(S.derby));
    ok(S.pts-pts0>=sc*50,'derby: Tide Points paid',S.pts-pts0);
    ok(hasTrophy('fu_dtf1'),'derby: bronze trophy granted at 5+');
    const nt=nTrophies();P.startDerby();land(6);land(6);land(6);await run();
    ok(S.derby.best.fish===12&&nTrophies()===nt&&!hasTrophy('fu_dtf2'),'derby: replay raises best, no second trophy',S.derby.best.fish+'/'+nTrophies());
    {const m=P.npcs().find(a=>a.derby);G.px=m.x;G.py=m.y+24;P.talkTo(m);let g=0;while(g++<40){await wait(5);if(P.DLG.on&&P.DLG.choices){P.dlgAdvance();P.choose(0)}else if(P.DLG.on)P.dlgAdvance();else if(!G.busy)break}
     ok(P.tr&&P.tr.k==='fish'&&!G.busy,'derby: talking to Marlowe starts a round');}
    P.enterHouse();ok(P.tr===null,'derby: entering house cancels round');P.exitHouse();
    P.startDerby();P.startTour();ok(P.tr===null,'derby: starting a tour cancels round');P.returnHome();
    at(bw,11);P.startDerby();const big=P.BUGS.find(b=>b.p>=1000);P.catchBug(big);ok(P.tr&&P.tr.k==='bug'&&P.tr.score===3,'derby: pricey bug scores 3 on bug week',P.tr&&P.tr.score);
    land(6);ok(P.tr.score===3,'derby: fish scores 0 on bug week');P.enterHouse();P.exitHouse();
    const o=JSON.parse(JSON.stringify(S));delete o.derby;P.loadFrom(JSON.stringify(o));
    ok(P.S.derby&&P.S.derby.best.fish===0&&P.S.derby.last.bug===-1,'derby: v1.1 save gets defaults');
    ok(P.IT.fu_dtb3&&P.IT.fu_dtf3.c==='furn','derby: trophy items defined');
  }catch(e){ok(false,'derby block threw',e.stack)}

  // v1.2.0 Isle Bloom Rating
  try{
    await fresh();let S=P.S;const I=P.ISLE;
    const r0=P.bloomScore();
    ok(r0&&typeof r0.score==='number'&&r0.score>=0&&Array.isArray(r0.parts)&&r0.parts.length>=6,'bloom: bloomScore returns score and 6+ parts',r0&&r0.parts.length);
    ok(S.bloom&&S.bloom.day>=0&&typeof S.bloom.stars==='number','bloom: dailyRefresh stored rating',JSON.stringify(S.bloom));
    {const o=JSON.parse(JSON.stringify(S));delete o.bloom;P.loadFrom(JSON.stringify(o));S=P.S;
     ok(S.bloom&&S.bloom.best===0&&S.bloom.day===-1&&S.bloom.stars===0,'bloom: old save gets S.bloom defaults',JSON.stringify(S.bloom));}
    {const s0=P.bloomScore().score;let n=0;for(let i=0;i<I.obj.length&&n<20;i++)if(!P.ISLE.obj[i]&&P.ISLE.ter[i]===3){P.ISLE.obj[i]={k:'weed',v:0};n++}
     const s1=P.bloomScore().score;ok(n===20&&(s0>=500?s0-s1===500:s1===0),'bloom: 20 weeds lower score by 500',s0+'->'+s1);
     ok(P.bloomScore().parts.some(p=>/Pull \d+ weeds|pull \d+ weeds/.test(p[2]||'')),'bloom: weeds tip names a count');}
    // star 1 reward mailed once
    await fresh();S=P.S;const W=P.ISLE;
    for(let i=0;i<W.obj.length;i++){const o=W.obj[i];if(o&&(o.k==='flw'||o.k==='weed'||(o.k==='it'&&P.IT[o.id]&&/furn|junk/.test(P.IT[o.id].c))))W.obj[i]=null}
    const base=P.bloomScore().score;let need=Math.ceil((P.BLOOM_STARS[1]+150-base)/12),added=0;
    for(let i=0;i<W.obj.length&&added<need;i++)if(!W.obj[i]&&W.ter[i]===3){W.obj[i]={k:'flw',sp:'tulip',c:'red',st:3,w:-9};added++}
    S.bloom.best=0;S.bloom.stars=0;S.ach.bloom=0;
    const rs=()=>S.mail.filter(m=>m.from==='Resident Services'&&!m.read&&m.gift).length,m0=rs(),pts0=S.pts;
    S.lastDay-=1;P.processDays();
    ok(S.bloom.stars>=1&&S.bloom.stars<2&&S.bloom.best===1,'bloom: reaching star-1 threshold gives 1 star',base+' -> '+JSON.stringify(S.bloom));
    ok(rs()===m0+1&&S.mail[0].gift==='bottle'&&/1-star/.test(S.mail[0].text),'bloom: one Resident Services reward mail',rs()-m0);
    ok(S.ach.bloom===1&&S.pts>pts0,'bloom: Island Star achievement tier 1',S.ach.bloom);
    S.lastDay-=1;P.processDays();
    ok(rs()===m0+1&&S.bloom.best===1,'bloom: same star again adds no mail',rs()-m0);
    {S.mail[0].gv=0;S.mail.unshift({from:'Resident Services',text:'t',gift:'bag',gv:20000,read:0,day:S.lastDay});const c0=S.coins;
     P.openMail();click('[data-a="take"][data-i="0"]');await wait(5);ok(S.coins===c0+20000&&!S.mail[0].gift,'bloom: chime-bag reward pays 20,000',S.coins-c0);P.closePanel();S.mail.shift();}
    ok(P.RECIPES.r_flowerarch&&P.IT.fu_flowerarch&&P.IT.fu_bloom&&P.IT.fu_bloom.c==='furn','bloom: flower arch recipe and trophy defined');
    {S.inv.fill(null);P.addItem('wood',4);P.addItem('fw_rose_red',2);P.addItem('fw_tulip_pink',1);S.recipes.push('r_flowerarch');
     P.craft('r_flowerarch');ok(S.inv.some(s=>s&&s.id==='fu_flowerarch')&&!S.inv.some(s=>s&&/^fw_|^wood$/.test(s.id)),'bloom: flower arch crafts from any 3 flowers');}
    // Town Hall tab
    S.island='<b>Hx</b>';P.openHall();await adv(12);
    ok(click('[data-a="tab"][data-t="bloom"]'),'bloom: Island rating tab exists');await wait(5);
    const pb=document.getElementById('pBody');
    ok(pb&&pb.textContent.includes('★')&&S.bloom.stars>=1,'bloom: tab shows stars',S.bloom.stars);
    ok(pb&&/Hazel's advice:/.test(pb.textContent)&&pb.querySelector('.advice'),'bloom: advice line shown',pb&&pb.querySelector('.advice')&&pb.querySelector('.advice').textContent);
    ok(pb&&pb.textContent.includes('<b>Hx</b>')&&!pb.innerHTML.includes('<b>Hx</b>'),'bloom: island name escaped');
    P.closePanel();
    P.openBoard&&(P.openBoard(),ok(/Island rating: \d★/.test(document.getElementById('pBody').textContent),'bloom: bulletin board shows rating'),P.closePanel());
  }catch(e){ok(false,'bloom block threw',e.stack)}

  // v1.2.0 Mailbox trim keeps unclaimed gifts
  try{
    await fresh();const S=P.S;const ids=Object.keys(P.IT).filter(k=>/^fu_/.test(k)&&P.IT[k].s===1).slice(0,45);
    S.stor=[];S.mail=[];for(let i=0;i<40;i++)S.mail.push({from:'T',text:'t'+i,gift:ids[i],read:0,day:1});
    for(let i=40;i<45;i++)P.mail('T','new'+i,ids[i]);
    const lost=ids.filter(id=>!S.mail.some(m=>m.gift===id)&&!S.stor.some(s=>s.id===id));
    ok(!lost.length&&S.mail.length<=60,'mail: 45 gift letters lose no gift',lost.join(',')+' len '+S.mail.length);
    ok(S.mail.some(m=>/sent to storage/.test(m.text))&&S.flags.mailFull===1,'mail: storage note and nearly-full flag');
    S.stor=[];S.mail=[];for(let i=0;i<45;i++)S.mail.push(i%9===0?{from:'T',text:'g',gift:'fu_chair',read:i%2,day:1}:{from:'T',text:'x',gift:null,read:i%2,day:1});
    const g0=S.mail.filter(m=>m.gift).length;P.mail('T','hello');
    ok(S.mail.filter(m=>m.gift).length===g0&&S.mail.length===40&&!S.stor.length,'mail: giftless letters trimmed before gift letters',S.mail.length+'/'+g0);
    S.mail=[];S.storSize=S.stor.length;for(let i=0;i<70;i++)P.mail('T','full'+i,'fu_chair');
    ok(S.mail.length<=60&&S.mail.length>=55,'mail: never above 60 when storage is full',S.mail.length);S.storSize=200;
  }catch(e){ok(false,'mail trim block threw',e.stack)}

  // v1.2.0 Never silently lose items / collection progress
  try{
    await fresh();let S=P.S;const G=P.G;const full=()=>{for(let i=0;i<S.inv.length;i++)S.inv[i]={id:'wood',q:30}};
    P.startTour();full();let s0=S.stor.length;P.giveOrDrop('fu_plant');ok(S.stor.length===s0+1,'lose: tour + full pockets sends to storage');P.returnHome();
    P.enterHouse();full();s0=S.stor.length;P.giveOrDrop('fu_plant');ok(S.stor.length===s0+1,'lose: house + full pockets sends to storage');
    S.storSize=S.stor.length;P.giveOrDrop('fu_lamp');ok(S.mail[0].from==='Lost & Found'&&S.mail[0].gift==='fu_lamp','lose: storage full mails Lost & Found');S.storSize=200;P.exitHouse();
    ok(!P.giftFlow.toString().includes('||true'),'lose: dead ||true filter removed');
    S.inv.fill(null);S.inv[0]={id:'t_net0',q:1,d:10};S.inv[1]={id:'t_rod0',q:1,d:10};S.eq=0;
    const a=P.villActors()[0];a.home=false;const pr=P.giftFlow(a,false);await wait(5);
    ok(P.PAN.kind==='pick'&&!document.querySelector('[data-a="pickg"][data-i="0"]')&&document.querySelector('[data-a="pickg"][data-i="1"]'),'lose: equipped slot not giftable');
    click('[data-a="pickg"][data-i="1"]');await wait(5);
    ok(P.DLG.on&&P.DLG.choices&&P.DLG.choices.includes('No, keep it'),'lose: tool gift asks to confirm');
    if(P.DLG.on&&P.DLG.choices)P.choose(1);await wait(5);for(let g=0;g<20&&P.DLG.on;g++){await wait(5);P.dlgAdvance()}await Promise.race([pr,wait(300)]);
    ok(S.inv[1]&&S.inv[1].id==='t_rod0'&&!(S.stats.gifts>0),'lose: No keeps the tool');
    P.openShop();await adv(6);click('[data-a="tab"][data-t="sell"]');
    const sb=P.FISH.find(f=>f.n==='Sea bass'),cp=P.FISH.find(f=>f.n==='Carp');S.inv.fill(null);S.eq=-1;S.inv[0]={id:sb.id,q:1};S.inv[1]={id:sb.id,q:1};S.inv[2]={id:cp.id,q:1};
    delete S.don.fish[sb.i];S.don.fish[cp.i]=1;const exp=P.sellPrice(S.inv[2])+P.sellPrice(S.inv[0]),c0=S.coins;click('[data-a="tab"][data-t="sell"]');
    click('[data-a="sellcat"][data-c="fish,bug"]:not([data-all])');
    ok(P.invCount(sb.id)===1&&P.invCount(cp.id)===0&&S.coins-c0===exp,'lose: sell all keeps one undonated species',P.invCount(sb.id)+'/'+P.invCount(cp.id)+' '+(S.coins-c0)+' vs '+exp);
    click('[data-a="sellcat"][data-all="1"]');ok(P.invCount(sb.id)===0,'lose: Sell everything anyway sells all');P.closePanel();
  }catch(e){ok(false,'lose block threw',e.stack)}

  // v1.2.0 Freeze hazards while menus/dialogs are open
  try{
    await fresh();const S=P.S,G=P.G;if(G.scene!=='island')P.exitHouse();S.flags.stung=0;G.stung=0;G.faint=0;P.closePanel();
    const w={b:P.BUGS.find(b=>b.sp==='wasp'),sp:'wasp',x:G.px+20,y:G.py,ox:0,oy:0,z:16,st:'chase',born:G.t,t:0,al:1};P.bugs().push(w);
    P.openInv();for(let i=0;i<40;i++)P.step(.05);
    ok(!S.flags.stung&&P.bugs().includes(w),'freeze: wasp cannot sting inside Pockets');
    P.closePanel();for(let i=0;i<40&&!S.flags.stung;i++)P.step(.05);ok(S.flags.stung===1,'freeze: wasp stings after closing');
    S.flags.stung=0;G.stung=0;G.faint=0;const tb=P.BUGS.find(b=>b.chase);
    P.openShop();await wait(5);ok(P.DLG.on,'freeze: dialog open');
    P.bugs().push({b:tb,sp:tb.sp,x:G.px+8,y:G.py,ox:G.px,oy:G.py,st:'chase',t:0,al:1,born:G.t,z:0,hop:0});
    for(let i=0;i<40;i++)P.step(.05);ok(G.faint<=0,'freeze: chasing tarantula cannot knock out during dialog');
    await adv(6);P.closePanel();
  }catch(e){ok(false,'freeze block threw',e.stack)}

  // v1.2.0 No per-frame allocations / events cache
  try{
    await fresh();const S=P.S,G=P.G;P.closePanel();
    const a=P.fishes(),b=P.bugs(),pp=P.parts();for(let i=0;i<100;i++){P.step(.016);P.render()}
    ok(a===P.fishes()&&b===P.bugs()&&pp===P.parts(),'prune: entity arrays keep their instances');
    const e1=P.events(),e2=P.events();ok(e1===e2,'prune: events() cached within a minute');
    P.timeTravel(S.timeOff+3600e3);ok(P.events()!==e1,'prune: timeTravel refreshes events()');
    const d=new Date(new Date().getFullYear(),11,31,21,0,0,0);P.timeTravel(d.getTime()-Date.now());if(G.scene!=='island')P.exitHouse();P.closePanel();
    let sawB=0;for(let i=0;i<600;i++){if(i%40===0)P.stars().push({x:100,y:20,vx:-300,vy:150,t:0,l:.9,w:false});P.step(.05);P.render();sawB=Math.max(sawB,P.bursts().length)}
    ok(sawB>0&&P.stars().length<5,'prune: 600 steps with fireworks and shooting stars',sawB+'/'+P.stars().length);
  }catch(e){ok(false,'prune block threw',e.stack)}

  // v1.2.0 Screen shake + Reduce motion
  try{
    await fresh();let S=P.S;const G=P.G;P.closePanel();if(G.scene!=='island')P.exitHouse();
    const proto=CanvasRenderingContext2D.prototype,orig=proto.setTransform;let calls=[];proto.setTransform=function(...x){calls.push(x);return orig.apply(this,x)};
    const world=(sh,rnd)=>{const mr=Math.random;Math.random=()=>rnd;G.shake=sh;calls=[];try{P.render()}finally{Math.random=mr;G.shake=0}return calls[1]||[]};
    try{S.set.rm=false;const r0=world(0,.95),r1=world(.3,.95);ok(r1[4]!==r0[4]||r1[5]!==r0[5],'motion: shake offsets the world transform',r0+' | '+r1);
      S.set.rm=true;const r2=world(.3,.95);ok(r2[4]===r0[4]&&r2[5]===r0[5],'motion: reduce motion disables shake');}finally{proto.setTransform=orig}
    ok(P.wob({_sh:G.t-.1})===0,'motion: tree wobble off when calm');S.set.rm=false;ok(P.wob({_sh:G.t-.1})!==0,'motion: tree wobble on otherwise');S.set.rm=true;
    const n0=P.parts().length;P.puff(0,0,14,'#fff');ok(P.parts().length-n0<=3,'motion: puff capped at 3 when calm',P.parts().length-n0);
    const o=JSON.parse(JSON.stringify(S));o.set={music:.3,sfx:.5};P.loadFrom(JSON.stringify(o));S=P.S;
    ok(S.set.rm===null&&S.set.music===.3&&S.set.sfx===.5,'motion: old save gets set.rm=null, keeps volumes',JSON.stringify(S.set));
    P.openPhone('set');await wait(5);ok(click('[data-a="rm"][data-v="1"]')&&S.set.rm===true&&!document.querySelector('[data-a="rm"][data-v="1"]').classList.contains('alt'),'motion: Settings toggle On re-renders');
    click('[data-a="rm"][data-v="0"]');ok(S.set.rm===false&&document.querySelector('[data-a="rm"][data-v="0"]').getAttribute('aria-pressed')==='true','motion: Settings toggle Off');
    click('[data-a="rm"][data-v="auto"]');ok(S.set.rm===null,'motion: Settings toggle Auto');P.closePanel();
  }catch(e){ok(false,'motion block threw',e.stack)}

  // v1.2.0 Heart Day
  try{
    await fresh();const S=P.S,G=P.G;S.moveIn=null;const y=new Date().getFullYear()+1;
    S.vill.forEach((v,i)=>{v.fr=[30,10,120,24,40][i]??30});
    P.timeTravel(new Date(y,1,14,9,0,0,0).getTime()-Date.now());P.processDays();
    ok(P.events().some(e=>/Heart Day/.test(e)),'heart: events line on Feb 14');
    const cnt=()=>S.vill.map(v=>S.mail.filter(m=>m.from===P.VPOOL[v.p].n&&m.day===S.lastDay).length);
    const c1=cnt();ok(S.vill.every((v,i)=>c1[i]===(v.fr>=25?1:0)),'heart: one letter from each friend (fr>=25), none otherwise',c1.join(','));
    ok(S.mail.some(m=>m.gift==='choco')&&P.IT.choco&&P.IT.choco.c==='candy','heart: chocolate gift defined and sent');
    {const bf=P.VPOOL[S.vill[2].p].n,m=S.mail.find(q=>q.from===bf&&q.day===S.lastDay);ok(m&&/^fu_/.test(m.gift),'heart: best friend sends furniture',m&&m.gift)}
    S.lastDay-=1;P.processDays();const c2=cnt();ok(c2.join()===c1.join(),'heart: no duplicates on a second processDays',c2.join(','));
    {const v=S.vill.find(q=>q.fr>=25&&P.VPOOL[q.p].bd.join()!=='2,14');S.met[v.p]=1;v.td=-1;const a=P.villActors().find(q=>q.v===v);a.home=false;a.x=G.px;a.y=G.py+24;P.closePanel();
     P.talkTo(a);await wait(5);ok(P.DLG.on&&/Heart Day/.test(P.DLG.full),'heart: first talk uses Heart Day line',P.DLG.full);
     for(let g=0;g<40&&(P.DLG.on||G.busy);g++){if(P.DLG.choices){P.dlgAdvance();P.choose(P.DLG.choices.length-1)}else P.dlgAdvance();await wait(5)}}
    P.timeTravel(new Date(y,1,15,9,0,0,0).getTime()-Date.now());
    ok(!P.events().some(e=>/Heart Day/.test(e))&&!S.mail.some(m=>m.day===S.lastDay&&/Heart Day/.test(m.text)),'heart: nothing on Feb 15');
  }catch(e){ok(false,'heart block threw',e.stack)}

  // v1.2.0 Critterpedia filters
  try{
    await fresh();const S=P.S;const y=new Date().getFullYear()+1;P.closePanel();
    P.timeTravel(new Date(y,8,28,11,0,0,0).getTime()-Date.now());S.pedia.fish={};S.pedia.bug={};

    const junk=JSON.parse(P.serialize());junk.rec={fish:[],bug:null,tro:'x',ms:99};P.loadFrom(JSON.stringify(junk));S=P.S;ok(!Array.isArray(S.rec.fish)&&S.rec.bug&&S.rec.tro===0&&S.rec.ms===P.REC_MS.length,'rec: bad rec data sanitized');
    // tr flag survives storage round trip and drop/pickup keeps it
    S.inv.fill(null);S.inv[0]={id:f.id,q:1,tr:1};P.PA.stIn({i:0});const si=S.stor.findIndex(s=>s.id===f.id&&s.tr);ok(si>=0,'rec: trophy flag kept in storage');
    P.PA.stOut({i:si});ok(S.inv.some(s=>s&&s.id===f.id&&s.tr===1),'rec: trophy flag kept when taken out of storage');
  }catch(e){ok(false,'v1.6.0 Record Book block threw',e.stack)}

  // v1.6.0 corrupt-save protection + backup slot
  try{
    await fresh();const K=P.SAVE_KEY,B=P.BAK_KEY,J=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
    ok(B===K+'.bak'&&K==='puddlewick-isle.v1','bak: backup key is SAVE_KEY.bak, main key unchanged');
    localStorage.removeItem(B);P.G.saveN=0;for(let i=0;i<10;i++)P.save();
    let b=J(B);ok(b&&b.seed===P.S.seed,'bak: every 10th save copies a backup with the same seed');
    localStorage.removeItem(B);P.S.lastDay--;P.processDays();b=J(B);ok(b&&b.seed===P.S.seed,'bak: a new island day copies the backup');
    const good=JSON.parse(P.serialize());good.island='Bakton';localStorage.setItem(B,JSON.stringify(good));localStorage.setItem(K,'{broken');
    P.boot();const bb=document.getElementById('btnBak');
    ok(!bb.hidden&&/Restore backup \(saved /.test(bb.textContent),'bak: title offers Restore backup',bb.textContent);
    ok(!document.getElementById('tDmg').hidden&&/damaged/.test(document.getElementById('tDmgT').textContent)&&document.getElementById('tContinue').hidden,'bak: damaged notice shown, Continue hidden');
    bb.click();await adv(4);
    ok(P.S.island==='Bakton','bak: restoring loads the backup island',P.S.island);
    ok((J(K)||{}).island==='Bakton','bak: restore rewrites the main slot');
    localStorage.removeItem(B);localStorage.setItem(K,'{broken');P.boot();
    ok(document.getElementById('btnBak').hidden&&!document.getElementById('tDmg').hidden,'bak: notice without restore button when there is no backup');
    const f=document.getElementById('newForm'),sub=()=>f.dispatchEvent(new Event('submit',{cancelable:true}));
    sub();ok(localStorage.getItem(K)==='{broken'&&/again/.test(document.getElementById('btnNew').textContent),'bak: first New Game submit keeps the damaged save');
    sub();await adv(12);const n=J(K);ok(n&&n.seed===P.S.seed,'bak: second submit starts and saves the new island');
    localStorage.setItem(K,'{"v":1}');P.boot();ok(!document.getElementById('tDmg').hidden,'bak: parseable but invalid save also counts as damaged');
    localStorage.setItem(K,P.serialize());P.boot();ok(document.getElementById('tDmg').hidden&&!document.getElementById('tContinue').hidden,'bak: valid save shows Continue');
  }catch(e){ok(false,'v1.6.0 save backup block threw',e.stack)}

  // v1.6.0 text speed + text size
  try{
    await fresh();const ns=P.newState({name:'a',island:'b',hemi:'N',look:{}});ok(ns.set.ts===1&&ns.set.fs===1,'text: newState defaults ts=1 fs=1');
    const o=JSON.parse(P.serialize());delete o.set.ts;delete o.set.fs;P.loadFrom(JSON.stringify(o));ok(P.S.set.ts===1&&P.S.set.fs===1,'text: old save gets ts and fs');
    P.S.set.ts=3;P.showDlg({n:'X'},'Hello there, friend!');ok(P.DLG.shown===P.DLG.full.length,'text: instant shows the whole line at once');P.dlgAdvance();P.dlgAdvance();
    const run=ts=>{P.S.set.ts=ts;P.showDlg({n:'X'},'x'.repeat(200));for(let i=0;i<10;i++)P.updateDlg(.05);const n=P.DLG.shown;P.dlgAdvance();P.dlgAdvance();return n};
    const a0=run(0),a1=run(1),a2=run(2);ok(a0<a1&&a1<a2,'text: slow < normal < fast after 0.5 s',a0+'/'+a1+'/'+a2);
    P.S.set.ts=1;P.S.set.fs=1;P.applyCalm();P.showDlg({n:'X'},'hi');const box=document.getElementById('dlgBox'),f1=parseFloat(getComputedStyle(box).fontSize);
    P.S.set.fs=1.3;P.applyCalm();const f2=parseFloat(getComputedStyle(box).fontSize);ok(Math.abs(f2/f1-1.3)<.03,'text: size 1.3 scales the dialog font',f1+'/'+f2);P.dlgAdvance();P.dlgAdvance();
    const hint=parseFloat(getComputedStyle(document.getElementById('hint')).fontSize);ok(Math.abs(hint-14*1.3)<.5,'text: hint scales too',hint);
    const pw=document.getElementById('pWin'),pb=document.getElementById('pBody'),wide=[];
    for(const t of ['set','tasks','neigh','help','cat']){P.closePanel();P.openPhone(t);pw.style.width='360px';if(pb.scrollWidth>pb.clientWidth+1)wide.push(t+':'+pb.scrollWidth+'/'+pb.clientWidth)}
    pw.style.width='';ok(!wide.length,'text: 360px panels do not overflow at size 1.3',wide.join(' '));
    P.closePanel();P.S.set.fs=1;P.openPhone('set');
    const fb=document.querySelector('[data-a="fs"][data-v="1.15"]'),tb=document.querySelector('[data-a="ts"][data-v="2"]');ok(fb&&tb&&fb.getAttribute('aria-pressed')==='false','text: Settings has size and speed buttons');
    fb.click();document.querySelector('[data-a="ts"][data-v="2"]').click();ok(document.querySelector('[data-a="fs"][data-v="1.15"]').getAttribute('aria-pressed')==='true','text: pressed state updates');
    const sv=JSON.parse(localStorage.getItem(P.SAVE_KEY));ok(sv.set.fs===1.15&&sv.set.ts===2,'text: settings saved',JSON.stringify(sv.set));
    P.closePanel();P.loadFrom(localStorage.getItem(P.SAVE_KEY));ok(P.S.set.fs===1.15&&P.S.set.ts===2,'text: settings persist across reload');
    P.S.set.fs=1;P.S.set.ts=1;P.applyCalm();
  }catch(e){ok(false,'v1.6.0 text settings block threw',e.stack)}

  // v1.6.0 sane daily tasks + free swap
  try{
    await fresh();const S=P.S,IT=P.IT,isT=(id,t)=>IT[id]&&IT[id].tool===t;
    S.musRw={fish:4,bug:4,fossil:4};let don=0;for(let d=1;d<=50;d++){P.dailyRefresh(S.lastDay+d);if(S.tasks.some(t=>t.k==='donated'))don++}
    ok(don===0&&!P.taskCan('donated'),'tasks: no donate task when every hall is complete',don);
    S.musRw={fish:0,bug:4,fossil:4};ok(P.taskCan('donated'),'tasks: donate allowed while a hall is incomplete');
    S.inv=S.inv.map(x=>x&&isT(x.id,'shovel')?null:x);S.stor=S.stor.filter(x=>!isT(x.id,'shovel'));S.recipes=S.recipes.filter(k=>!isT(P.RECIPES[k].out,'shovel'));
    let fo=0;for(let d=60;d<110;d++){P.dailyRefresh(S.lastDay+d);if(S.tasks.some(t=>t.k==='fossils'))fo++}
    ok(fo===0&&!P.taskCan('fossils'),'tasks: no fossil task without a shovel or its recipe',fo);
    S.recipes.push('r_sho0');ok(P.taskCan('fossils')&&P.taskCan('rocks'),'tasks: knowing the shovel recipe enables fossils and rocks');
    P.dailyRefresh(S.lastDay+200);S.tasks.forEach(t=>{t.done=0;t.prog=0});S.tasks[0].done=1;const before=S.tasks.map(t=>t.k);
    P.openPhone('tasks');const btn=document.querySelector('[data-a="taskSwap"][data-i="1"]');
    ok(btn&&!btn.disabled&&!document.querySelector('[data-a="taskSwap"][data-i="0"]'),'tasks: Swap on unfinished rows only');
    btn.click();const after=S.tasks.map(t=>t.k);
    ok(after.filter((k,i)=>k!==before[i]).length===1&&!before.includes(after[1])&&new Set(after).size===after.length,'tasks: swap replaces exactly one task with a new kind',before+' -> '+after);
    ok(S.dly.rr===1&&[...document.querySelectorAll('[data-a="taskSwap"]')].every(b=>b.disabled),'tasks: swap disabled for the rest of the day');
    ok(!P.taskSwap(2)&&S.tasks[2].k===before[2],'tasks: a second swap is refused');
    ok(/Achievements/.test(document.getElementById('pBody').textContent),'tasks: achievements still listed');P.closePanel();
    P.dailyRefresh(S.lastDay+201);ok(!S.dly.rr,'tasks: the swap returns after the next refresh');
    const o=JSON.parse(P.serialize());o.tasks=[{k:'donated',n:1,t:'Donate to the museum',pts:200,prog:0,done:0}];o.musRw={fish:4,bug:4,fossil:4};P.loadFrom(JSON.stringify(o));
    ok(P.S.tasks.length===1&&P.S.tasks[0].k==='donated','tasks: old saves keep their current tasks');
  }catch(e){ok(false,'v1.6.0 daily tasks block threw',e.stack)}

  // v1.6.0 Neighbors app progress
  try{
    await fresh();const S=P.S,v=S.vill[0],Pv=P.VPOOL[v.p],row=()=>{P.closePanel();P.openPhone('neigh');return document.querySelectorAll('#pBody .li')[0]};
    Object.assign(v,{fr:40,rcp:0,fav:0,photo:0,td:-1,gd:-1,req:null});let r=row();const w=parseFloat(r.querySelector('.bar i').style.width);
    ok(Math.abs(w-43)<1.5,'neigh: friendship bar ~43% at 40',w);
    ok(/Next: secret DIY at 45/.test(r.textContent)&&/5 to go/.test(r.textContent),'neigh: next unlock is the secret DIY',r.textContent);
    ok(!/✅|🎁/.test(r.textContent),'neigh: no talked/gifted marks yet');
    v.td=S.lastDay;v.gd=S.lastDay;r=row();ok(/✅/.test(r.textContent)&&/🎁/.test(r.textContent),'neigh: talked and gifted today marks');
    v.gd=S.lastDay-1;r=row();ok(/✅/.test(r.textContent)&&!/🎁/.test(r.textContent),'neigh: gift mark only when gifted today');
    Object.assign(v,{fr:100,rcp:1,fav:1,photo:1});r=row();ok(/All friendship gifts received/.test(r.textContent),'neigh: all gifts received');
    Object.assign(v,{fr:50,rcp:1,fav:0,photo:0});r=row();ok(/favorite keepsake at 60/.test(r.textContent),'neigh: next unlock skips gifts already received');
    v.td=-1;v.req={id:'wood',rw:400,done:0};r=row();ok(/Has a request, go say hi!/.test(r.textContent)&&!/wants/.test(r.textContent),'neigh: unheard request hint hides the item');
    v.td=S.lastDay;r=row();ok(/wants: Wood/i.test(r.textContent),'neigh: heard request shows the item',r.textContent);
    const n0=Pv.n;Pv.n='<b>Bo';try{r=row();ok(r.querySelector('.grow > b').textContent.includes('<b>Bo')&&!r.querySelector('.grow > b b'),'neigh: names are escaped')}finally{Pv.n=n0}
    P.closePanel();
  }catch(e){ok(false,'v1.6.0 neighbors block threw',e.stack)}

  // v1.6.0 cheaper HUD + smarter resize
  try{
    await fresh();P.closePanel();P.updateHUD();P.updateHUD();
    const mo=new MutationObserver(()=>{});mo.observe(document.getElementById('hud'),{subtree:true,childList:true,attributes:true,characterData:true});
    for(let i=0;i<25;i++)P.updateHUD();const n0=mo.takeRecords().length;ok(n0===0,'hud: 25 idle updates make 0 mutations',n0);
    P.S.coins+=7;P.updateHUD();const rec=mo.takeRecords();mo.disconnect();
    ok(rec.length===1&&rec[0].target.id==='hCoins','hud: a coin change is exactly one #hCoins mutation',rec.map(m=>m.type+':'+(m.target.id||m.target.nodeName)).join(','));
    P.render();P.EMO.set('__probe',1);window.dispatchEvent(new Event('resize'));window.dispatchEvent(new Event('resize'));await wait(60);
    ok(P.EMO.has('__probe'),'hud: same-size resize keeps emoji sprites');
    const dp=Object.getOwnPropertyDescriptor(window,'devicePixelRatio'),cur=Math.min(2,devicePixelRatio||1);
    Object.defineProperty(window,'devicePixelRatio',{configurable:true,get:()=>cur>=2?1:2});P.resize();ok(!P.EMO.has('__probe'),'hud: a DPR change clears emoji sprites');
    if(dp)Object.defineProperty(window,'devicePixelRatio',dp);else delete window.devicePixelRatio;P.resize();P.render();ok(P.EMO.size>0,'hud: sprites rebuild after DPR change');
  }catch(e){ok(false,'v1.6.0 HUD block threw',e.stack)}

  // v1.6.0 platform-aware control text
  try{
    const foot=()=>document.querySelector('#title .foot').textContent;
    const lines=async()=>{P.closePanel();P.newGame({name:'Tess',island:'Testa',hemi:'N',look:{skin:'#fbe0c8',hair:'#3b2a1e',shirt:'#3f9fd2'}});P.startGame(true);const L=[];for(let k=0;k<12;k++){await wait(5);if(P.DLG.on){L.push(P.DLG.full);P.dlgAdvance();P.dlgAdvance()}else if(!P.G.busy)break}return L};
    P.setTouch(false);P.boot();const kf=foot();ok(/WASD/.test(kf),'ctl: keyboard footer keeps WASD');
    P.setTouch(true);P.boot();ok(!/WASD/.test(foot())&&/stick/.test(foot()),'ctl: touch footer has no WASD',foot());
    let L=await lines();const tl=L.find(l=>/switch tools/.test(l))||'';ok(/🔧 button/.test(tl)&&!/Q or R/.test(tl),'ctl: Hazel mentions the tool button on touch',tl);
    P.openPhone('help');const mv=[...document.querySelectorAll('#pBody .li')].find(e=>/Move/.test(e.textContent));ok(mv&&/stick/.test(mv.textContent)&&!/WASD/.test(mv.textContent),'ctl: Guide Move row mentions the stick');P.closePanel();
    ok(P.ctl('phone')==='tap 📱'&&P.ctl('act')==='A button'&&P.ctl('tool')==='🔧 button','ctl: touch labels');
    P.setTouch(false);P.boot();ok(foot()===kf,'ctl: keyboard footer unchanged');
    L=await lines();ok(L.includes("Here's a flimsy net and a fishing rod to get you started. Press Q or R to switch tools, and Space to use them."),'ctl: keyboard Hazel line unchanged');
    ok(P.ctl('phone')==='P'&&P.ctl('act')==='Space'&&P.ctl('tool')==='Q / R','ctl: keyboard labels');
    P.openPhone('help');ok(/WASD or arrow keys/.test(document.getElementById('pBody').textContent),'ctl: keyboard Guide unchanged');P.closePanel();
    document.getElementById('touch').hidden=true;document.body.classList.remove('touch');
  }catch(e){P.setTouch(false);ok(false,'v1.6.0 control text block threw',e.stack)}

  // v1.6.0 audio pause when hidden + sticky sound settings
  try{
    await fresh();const real=P.AU.c,calls=[];let made=0,hid=true;
    const mock={state:'running',currentTime:0,sampleRate:44100,suspend(){calls.push('s');this.state='suspended';return Promise.resolve()},resume(){calls.push('r');this.state='running';return Promise.resolve()},createOscillator(){made++;throw new Error('no')},createGain(){made++;throw new Error('no')}};
    P.AU.c=mock;Object.defineProperty(document,'hidden',{configurable:true,get:()=>hid});
    try{
      document.dispatchEvent(new Event('visibilitychange'));ok(calls[0]==='s'&&mock.state==='suspended','audio: hidden tab suspends the AudioContext');
      hid=false;P.S.set.music=.5;P.musicTick();ok(made===0,'audio: musicTick schedules nothing while suspended');
      document.dispatchEvent(new Event('visibilitychange'));ok(calls[1]==='r'&&mock.state==='running','audio: visible tab resumes');
    }finally{delete document.hidden;P.AU.c=real}
    P.openPhone('set');const sl=document.querySelector('input[data-set="sfx"]');sl.value='0.4';sl.dispatchEvent(new Event('input',{bubbles:true}));sl.dispatchEvent(new Event('change',{bubbles:true}));
    ok(JSON.parse(localStorage.getItem(P.SAVE_KEY)).set.sfx===0.4,'audio: Effects change is saved');
    const o=sl.nextElementSibling;ok(o&&o.tagName==='OUTPUT'&&o.textContent==='40%'&&sl.getAttribute('aria-valuetext')==='40%','audio: Effects output and aria-valuetext',o&&o.textContent);
    const ms=document.querySelector('input[data-set="music"]');ok(ms.nextElementSibling.textContent===Math.round(P.S.set.music*100)+'%'&&ms.getAttribute('aria-valuetext')===ms.nextElementSibling.textContent,'audio: Music output');
    P.closePanel();
  }catch(e){ok(false,'v1.6.0 audio block threw',e.stack)}

  // v1.6.0 rainbows after the rain
  try{
    await fresh();const S=P.S;if(P.G.scene!=='island')P.exitHouse();
    const at=(dd,h)=>{const d=new Date();d.setDate(d.getDate()+dd);d.setHours(h,30,0,0);P.timeTravel(d.getTime()-Date.now())};
    let found=null,bad=0,checked=0;
    for(let dd=1;dd<=150&&bad<3;dd++){for(const h of [8,12,16]){at(dd,h);const day=S.lastDay,w=P.weather(day,h),exp=(w==='sunny'||w==='cloudy')&&P.weather(day,h-4)==='rain',rb=P.rainbowNow();checked++;
      if(rb!==exp)bad++;if(exp&&!found)found=[dd,h]}if(found&&dd>found[0]+20)break}
    ok(found&&bad===0,'rainbow: true exactly after a rain-to-dry block change',JSON.stringify(found)+' bad '+bad+' of '+checked);
    if(found){at(found[0],found[1]);ok(P.rainbowNow(),'rainbow: shows at the found block');
      ok(P.events().some(e=>e==='🌈 A rainbow over '+S.island+'!'),'rainbow: events line');
      const dI=CanvasRenderingContext2D.prototype.drawImage;let drew=0;CanvasRenderingContext2D.prototype.drawImage=function(img,...a){if(img===P.RAINBOW)drew++;return dI.call(this,img,...a)};
      const r1=P.RAINBOW;try{P.render();P.render()}finally{CanvasRenderingContext2D.prototype.drawImage=dI}ok(drew===2&&P.RAINBOW===r1&&r1 instanceof HTMLCanvasElement,'rainbow: cached sprite drawn once per frame',drew);
      P.enterHouse();ok(!P.rainbowNow()&&!P.events().some(e=>/🌈/.test(e)),'rainbow: not indoors');P.exitHouse();
      ok(P.rainbowNow(),'rainbow: back outdoors');P.startTour();ok(!P.rainbowNow(),'rainbow: not on tours');P.returnHome();
      at(found[0],20);ok(!P.rainbowNow()&&!P.events().some(e=>/🌈/.test(e)),'rainbow: never at night')}
    {let no=null;for(let dd=1;dd<=60&&!no;dd++){at(dd,12);if(!P.rainbowNow())no=dd}ok(no&&!P.events().some(e=>/🌈/.test(e)),'rainbow: no events line without a rainbow')}
  }catch(e){ok(false,'v1.6.0 rainbow block threw',e.stack)}

  try{ // review fixes: backup erase, rainbow cache, trophy-safe removeItem, phone text scaling, wardrobe a11y
    await fresh();const S=P.S;
    S.inv=S.inv.map(()=>null);S.inv[0]={id:Object.keys(P.IT).find(k=>P.IT[k].c==='fish'),q:1,tr:1};S.inv[1]={id:S.inv[0].id,q:1};
    P.removeItem(S.inv[0].id,1);ok(S.inv[0]&&S.inv[0].tr===1&&!S.inv[1],'review: removeItem hands over the plain catch before the trophy');
    const rules=[];for(const sh of document.styleSheets)try{for(const r of sh.cssRules)if(r.media)for(const q of r.cssRules)rules.push(r.media.mediaText+'|'+q.cssText)}catch(e){}
    const fx=(mq,sel)=>{const m=rules.filter(t=>t.includes(mq)&&t.split('|')[1].startsWith(sel+' ')&&/font-size/.test(t));return m.length>0&&m.every(t=>/var\(--fs\)/.test(t))};
    ok(fx('max-width: 560px','#dlgBox')&&fx('max-height: 480px','#dlgBox')&&fx('max-width: 560px','#clock b'),'review: phone media queries scale dialog and clock with text size');
    if(!S.closet.length)S.closet.push('cl_sunhat');P.openWardrobe();const html=document.getElementById('pBody').innerHTML;ok(!/>To pockets</.test(html)&&!/aria-label="Dressing mirror"/.test(html),'review: wardrobe uses labelled compact buttons');P.closePanel();
    const sd=P.S.seed;P.rainbowNow();P.S.seed=sd+1;P.rainbowNow();ok(true,'review: rainbow cache tolerates a seed change');P.S.seed=sd;
  }catch(e){ok(false,'review fixes block threw',e.stack)}

  // ---- feature tests: append new blocks above this line (END marker) ----
}catch(e){errs.push('EXC '+e.stack)}
const pre=document.createElement('pre');pre.id='RESULT';pre.textContent=out.join('\n')+'\n--ERRORS--\n'+errs.slice(0,25).join('\n');document.body.appendChild(pre);
})();
</script>
